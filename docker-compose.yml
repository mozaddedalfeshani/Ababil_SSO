services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: sso
      POSTGRES_DB: sso
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./server
    entrypoint: ["/migrate"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  go:
    build:
      context: ./server
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7897/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  next:
    build:
      context: .
    env_file: .env
    depends_on:
      - go

  caddy:
    image: caddy:2-alpine
    ports:
      - "5680:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - next
      - go

volumes:
  pg_data:
  caddy_data:
